openapi: 3.1.0
info:
  title: FPDS Analytics API
  version: '2026-06-18'
  summary: Public read-only API over Kenosa's FPDS analytics schemas — 78 datasets
    across 11 domains including topic intelligence.
  description: 'Dataset-oriented API for FPDS procurement analytics report views.

    The API exposes curated analytics datasets and dimensions only; it does not expose
    arbitrary SQL or raw FPDS tables.

    '
servers:
- url: https://YOUR_HOST
  description: Hosted deployment placeholder
- url: http://127.0.0.1:8010
  description: Local development
security:
- ApiKeyAuth: []
paths:
  /v1:
    get:
      summary: Service metadata
      security: []
      responses:
        '200':
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMetadata'
  /v1/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/ai-assistant-guide:
    get:
      summary: AI assistant usage guide
      description: 'Human- and model-readable instructions for using the API from
        ChatGPT,

        Claude, Gemini, or similar AI assistants.

        '
      security: []
      responses:
        '200':
          description: AI assistant instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAssistantGuide'
  /v1/catalog:
    get:
      summary: List public datasets and dimensions
      security: []
      parameters:
      - name: domain
        in: query
        schema:
          type: string
          enum:
          - acquisition
          - competition
          - concentration
          - contacts
          - customer
          - entrants
          - funding
          - geography
          - incumbent
          - market
          - naics
          - pipeline
          - pricing
          - psc
          - seasonality
          - set_aside
          - topics
      responses:
        '200':
          description: Dataset catalog.
          content:
            application/json:
              schema:
                type: object
                required:
                - notice
                - data
                - meta
                properties:
                  notice:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dataset'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
  /v1/datasets/{dataset_id}:
    get:
      summary: Describe one dataset
      security: []
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Dataset metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - notice
                - data
                - meta
                properties:
                  notice:
                    type: string
                  data:
                    $ref: '#/components/schemas/Dataset'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/Error'
  /v1/datasets/{dataset_id}/rows:
    get:
      summary: Query rows from an approved dataset
      description: 'Canonical row endpoint. Filters, fields, and sort keys are allowlisted
        per dataset.

        Unsupported filters are rejected instead of silently ignored.

        Public requests are capped to a small row limit.

        Provide X-Api-Key for partner access, higher rate limits, larger bounded

        responses, exports, or support.

        '
      security:
      - {}
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      - name: fiscal_year
        in: query
        schema:
          type: integer
          minimum: 1958
          maximum: 2026
      - name: fiscal_year_min
        in: query
        schema:
          type: integer
          minimum: 1958
          maximum: 2026
      - name: fiscal_year_max
        in: query
        schema:
          type: integer
          minimum: 1958
          maximum: 2026
      - name: contracting_dept_id
        in: query
        schema:
          type: string
      - name: contracting_agency_id
        in: query
        schema:
          type: string
      - name: principal_naics_code
        in: query
        schema:
          type: string
          pattern: ^[0-9]{6}$
      - name: sector_code
        in: query
        schema:
          type: string
          pattern: ^[0-9]{2}$
      - name: pop_state_code
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: uei
        in: query
        schema:
          type: string
          minLength: 12
          maxLength: 12
      - name: scope
        in: query
        schema:
          type: string
      - name: fields
        in: query
        description: Comma-separated subset of public fields.
        schema:
          type: string
      - name: sort
        in: query
        description: Allowlisted field; prefix with '-' for descending order.
        schema:
          type: string
      - name: limit
        in: query
        description: Public no-key requests are capped by deployment policy, default
          25. API-key requests can use the dataset maximum.
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 1000
      - name: cursor
        in: query
        schema:
          type: string
      - name: format
        in: query
        description: Response format. Omit for JSON; use csv for a bounded spreadsheet-friendly
          export.
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      responses:
        '200':
          description: Dataset rows.
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowsResponse'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/profiles/customer:
    get:
      summary: Build a composite customer profile from existing datasets
      description: Customer 360 endpoint. Requires contracting_dept_id or contracting_agency_id
        and returns bounded sections assembled from documented dataset queries only.
        Section-level failures return null for that section and are described in meta.sections.
      security:
      - {}
      - ApiKeyAuth: []
      parameters:
      - name: contracting_dept_id
        in: query
        schema:
          type: string
        description: Contracting department code, such as 9700 for DoD.
      - name: contracting_agency_id
        in: query
        schema:
          type: string
        description: Contracting agency code.
      responses:
        '200':
          description: Composite customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/dimensions:
    get:
      summary: List public dimensions and code lookups
      security: []
      responses:
        '200':
          description: Dimension catalog.
          content:
            application/json:
              schema:
                type: object
                required:
                - notice
                - data
                - meta
                properties:
                  notice:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dimension'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
  /v1/dimensions/{dimension_id}:
    get:
      summary: Query dimension/code lookup rows
      security: []
      parameters:
      - name: dimension_id
        in: path
        required: true
        schema:
          type: string
          enum:
          - agencies
          - bundling_codes
          - business_size_codes
          - canonical_topics
          - commercial_item_codes
          - competition_codes
          - contracting_offices
          - departments
          - financing_codes
          - naics
          - pricing_codes
          - psc_codes
          - reason_not_competed_codes
          - set_aside_codes
          - states
          - vehicle_programs
          - vehicle_type_codes
      - name: q
        in: query
        description: Optional text search for dimensions that support it.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Dimension rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowsResponse'
  /v1/exports:
    post:
      summary: Create a bounded async export
      description: Optional phase-2 endpoint. Exports must use the same dataset registry
        restrictions as row queries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Export accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
  /v1/exports/{export_id}:
    get:
      summary: Fetch export status
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Export status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
  # ── Profiles ─────────────────────────────────────────────────────────
  /v1/profiles/vendor:
    get:
      summary: Vendor intelligence profile
      description: Composite vendor 360 — summary stats, top agencies, cross-agency
        footprint, NAICS concentration, and recompete pipeline.
      parameters:
      - name: uei
        in: query
        required: true
        schema:
          type: string
        description: Vendor Unique Entity Identifier (12 characters).
      - name: contracting_dept_id
        in: query
        schema:
          type: string
        description: Optional FPDS department code to scope results.
      - name: contracting_agency_id
        in: query
        schema:
          type: string
        description: Optional FPDS agency code to scope results.
      responses:
        '200':
          description: Vendor profile with sections and narrative hints.
          content:
            application/json:
              schema:
                type: object
  /v1/profiles/topic:
    get:
      summary: Topic intelligence profile
      description: Top procurement topics for a department, trend classifications,
        competitive landscape, NAICS decomposition, and document links.
      parameters:
      - name: department_code
        in: query
        required: true
        schema:
          type: string
        description: Department code (USASpending 3-digit or FPDS 4-digit format).
      - name: topic_id
        in: query
        schema:
          type: integer
        description: Optional — focus on a specific topic.
      - name: q
        in: query
        schema:
          type: string
        description: Optional keyword filter for topic search.
      responses:
        '200':
          description: Topic profile with sections and narrative hints.
          content:
            application/json:
              schema:
                type: object
  /v1/profiles/vendors/compare:
    get:
      summary: Side-by-side vendor comparison
      description: Compare multiple vendors — summary stats, agency footprint, NAICS
        concentration, shared agencies, and shared NAICS codes.
      parameters:
      - name: ueis
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
        description: List of vendor UEIs to compare.
      - name: contracting_dept_id
        in: query
        schema:
          type: string
      - name: contracting_agency_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Vendor comparison with shared market analysis.
          content:
            application/json:
              schema:
                type: object
  # ── Keywords ─────────────────────────────────────────────────────────
  /v1/keywords/search:
    get:
      summary: Search procurement keywords
      description: Substring search on keyword text across product_vendor, method_service,
        and system_program categories.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: keyword_type
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [phrase, term]
      - name: category
        in: query
        schema:
          type: array
          items:
            type: string
            enum: [product_vendor, method_service, system_program]
      - name: department_code
        in: query
        schema:
          type: string
      - name: min_link_count
        in: query
        schema:
          type: integer
          default: 2
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Keyword search results with link counts and top departments.
          content:
            application/json:
              schema:
                type: object
  /v1/keywords/analytics:
    get:
      summary: Keyword procurement analytics
      description: Award count, total obligation, breakdown by agency/vendor/FY/NAICS/set-aside,
        and FY spending trend for a keyword.
      parameters:
      - name: keyword_id
        in: query
        schema:
          type: integer
      - name: keyword_text
        in: query
        schema:
          type: string
      - name: department_code
        in: query
        schema:
          type: string
      - name: fy_start
        in: query
        schema:
          type: integer
          default: 2018
      - name: fy_end
        in: query
        schema:
          type: integer
          default: 2026
      - name: group_by
        in: query
        schema:
          type: string
          enum: [agency, vendor, fy, naics, set_aside]
          default: agency
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Keyword analytics with obligation data and breakdowns.
          content:
            application/json:
              schema:
                type: object
  /v1/keywords/vs-topic:
    get:
      summary: Keyword-to-topic bridge
      description: Bidirectional bridge — keyword → topics (provide keyword_id or
        keyword_text) or topic → keywords (provide topic_id).
      parameters:
      - name: keyword_id
        in: query
        schema:
          type: integer
      - name: keyword_text
        in: query
        schema:
          type: string
      - name: topic_id
        in: query
        schema:
          type: integer
      - name: department_code
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 15
      responses:
        '200':
          description: Keyword-topic mapping results.
          content:
            application/json:
              schema:
                type: object
  /v1/keywords/compare:
    get:
      summary: Multi-keyword comparison
      description: Compare multiple keywords side-by-side — award count, total obligation,
        unique vendors, unique agencies, FY trend, and top 3 agencies each.
      parameters:
      - name: keywords
        in: query
        schema:
          type: array
          items:
            type: string
      - name: keyword_ids
        in: query
        schema:
          type: array
          items:
            type: integer
      - name: department_code
        in: query
        schema:
          type: string
      - name: fy_start
        in: query
        schema:
          type: integer
          default: 2018
      - name: fy_end
        in: query
        schema:
          type: integer
          default: 2026
      responses:
        '200':
          description: Side-by-side keyword comparison.
          content:
            application/json:
              schema:
                type: object
  /v1/keywords/vendor/{uei}:
    get:
      summary: Vendor keyword profile
      description: All keywords a vendor appears in across federal awards, with award
        counts, obligation amounts, and agency coverage.
      parameters:
      - name: uei
        in: path
        required: true
        schema:
          type: string
      - name: department_code
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: array
          items:
            type: string
      - name: fy_start
        in: query
        schema:
          type: integer
          default: 2018
      - name: fy_end
        in: query
        schema:
          type: integer
          default: 2026
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Vendor keyword profile with department summary.
          content:
            application/json:
              schema:
                type: object
  # ── Key Management ────────────────────────────────────────────────────
  /v1/signup:
    get:
      summary: API key signup form
      description: Browser-based HTML signup form for self-service API key creation.
      security: []
      responses:
        '200':
          description: HTML signup form.
          content:
            text/html:
              schema:
                type: string
  /v1/keys/request:
    post:
      summary: Request an API key
      description: Self-service API key signup. Returns a beta-tier key valid for 90 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                organization:
                  type: string
                intended_use:
                  type: string
      responses:
        '200':
          description: API key created. Plaintext key shown once.
          content:
            application/json:
              schema:
                type: object
  /v1/keys/list:
    post:
      summary: List active API keys
      description: List active keys for an email address. Never returns plaintext keys.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                key_prefix:
                  type: string
      responses:
        '200':
          description: List of active keys with tier and limits.
          content:
            application/json:
              schema:
                type: object
  /v1/keys/revoke:
    post:
      summary: Revoke an API key
      description: Revoke a key by email + key_prefix. Email is a verification gate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, key_prefix]
              properties:
                email:
                  type: string
                  format: email
                key_prefix:
                  type: string
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
  # ── MCP Transport ─────────────────────────────────────────────────────
  /v1/mcp:
    get:
      summary: MCP endpoint discovery
      description: Returns MCP server name, version, protocol version, and capabilities.
      security: []
      responses:
        '200':
          description: MCP server discovery info.
          content:
            application/json:
              schema:
                type: object
    post:
      summary: MCP JSON-RPC endpoint
      description: Streamable HTTP transport for MCP protocol. Supports tools/list,
        tools/call, prompts/*, resources/*. Public tools pass through without auth;
        tier-gated tools require Authorization header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Authentication required for protected tool.
  # ── OAuth ──────────────────────────────────────────────────────────────
  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth protected resource metadata
      description: RFC 9728 protected resource metadata for Claude.ai custom connector
        OAuth flow discovery.
      security: []
      responses:
        '200':
          description: Protected resource metadata.
          content:
            application/json:
              schema:
                type: object
  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth authorization server metadata
      description: RFC 8414 authorization server metadata.
      security: []
      responses:
        '200':
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                type: object
  /v1/oauth/authorize:
    get:
      summary: OAuth authorization page
      description: HTML form for entering an API key to authorize a client.
      security: []
      responses:
        '200':
          description: Authorization form.
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Process OAuth authorization
      description: Validate API key, issue authorization code, redirect to client.
      security: []
      responses:
        '302':
          description: Redirect with authorization code.
  /v1/oauth/token:
    post:
      summary: OAuth token endpoint
      description: Exchange authorization code for access token (PKCE), or refresh
        token for new access token.
      security: []
      responses:
        '200':
          description: Access token response.
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
        enum:
        - acquisition.agency_vehicle_mix_fy
        - acquisition.office_vehicle_mix_fy
        - acquisition.vehicle_program_summary
        - acquisition.vehicle_program_usage_fy
        - acquisition.vehicle_program_vendors
        - acquisition.vehicle_trend_fy
        - competition.agency_profile_fy
        - competition.commercial_mix_fy
        - competition.kpi_summary
        - competition.not_competed_reasons_fy
        - competition.sole_source_hotspots
        - competition.trend_fy
        - concentration.agency_profile
        - concentration.kpi_summary
        - concentration.small_biz_health_fy
        - concentration.trend_fy
        - concentration.vendor_cross_agency_rank
        - concentration.vendor_market_leaders
        - concentration.vendor_office_naics_year
        - contacts.detail
        - contacts.naics_buyers
        - contacts.office_coverage
        - contacts.office_roster
        - contacts.profile_fy
        - contacts.recompete_handlers
        - customer.agency_month_naics_fy
        - customer.agency_profile_fy
        - customer.kpi_summary
        - customer.office_month_naics_fy
        - customer.office_profile_fy
        - entrants.agency_cohort_fy
        - funding.assisted_acquisition_fy
        - funding.mismatch_flows_fy
        - geography.city_leaders
        - geography.kpi_summary
        - geography.mismatch_leaders
        - geography.place_profile_fy
        - geography.regional_summary_fy
        - geography.state_naics_fy
        - geography.state_trend_fy
        - geography.state_vendor_year
        - incumbent.agency_naics_vendor_leaders
        - incumbent.agency_vendor_leaders
        - incumbent.office_vendor_leaders
        - market.agency_naics_fy
        - market.entry_difficulty_score
        - market.naics_customer_leaders
        - market.naics_group_agency_fy
        - market.office_naics_fy
        - naics.agency_profile_fy
        - naics.growth_leaders
        - naics.kpi_summary
        - naics.trend_fy
        - opportunity.radar
        - pipeline.agency_recompete_summary
        - pipeline.award_size_distribution
        - pipeline.contract_transactions
        - pipeline.duration_profile
        - pipeline.modification_intelligence
        - pipeline.recompete_watchlist
        - pricing.agency_profile_fy
        - pricing.dept_year_summary
        - pricing.kpi_summary
        - pricing.risk_scorecard
        - pricing.trend_fy
        - psc.agency_profile_fy
        - psc.naics_agency_fy
        - psc.naics_crosswalk
        - psc.naics_office_fy
        - psc.office_profile_fy
        - psc.trend_fy
        - seasonality.agency_month_fy
        - seasonality.office_quarter_fy
        - set_aside.agency_mix_fy
        - set_aside.agency_profile_fy
        - set_aside.family_trend_fy
        - set_aside.kpi_summary
        - set_aside.office_profile_fy
        - set_aside.trend_fy
        - topics.agency_profile
        - topics.catalog
        - topics.competitive_landscape
        - topics.contract_type_profile
        - topics.document_links
        - topics.govwide_canonical
        - topics.lineage
        - topics.naics_decomposition
        - topics.psc_decomposition
        - topics.set_aside_profile
        - topics.trends
  schemas:
    ServiceMetadata:
      type: object
      required:
      - notice
      - name
      - api_version
      - status
      properties:
        notice:
          type: string
        name:
          type: string
          example: FPDS Analytics API
        api_version:
          type: string
          example: '2026-06-02'
        status:
          type: string
          example: ok
        documentation_url:
          type: string
        openapi_url:
          type: string
        ai_assistant_guide_url:
          type: string
        start_here:
          type: string
    Health:
      type: object
      required:
      - notice
      - status
      properties:
        notice:
          type: string
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        database:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
